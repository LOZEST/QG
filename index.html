 try{ref=db.doc('data/users/'+id+'/state')}catch(e){ref=null;setSync('Enregistré sur cet appareil');ready=true;return}
 setSync('Connexion…');
 const lt=setTimeout(()=>{setSync('Hors ligne — gardé sur cet appareil');ready=true},10000);
 ref.onSnapshot(snap=>{
  if(!snap.metadata.fromCache){clearTimeout(lt);setSync('Synchronisé');ready=true}
  if(pend||writing||snap.metadata.hasPendingWrites)return;
  if(snap.exists){migrated=false;S=norm(JSON.parse(JSON.stringify(snap.data())));if(migrated){migrated=false;save()}else{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render();trayLater()}}

 'BEGIN:VTIMEZONE','TZID:Europe/Paris','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
 for(const e of evs){const sum=`${e.type==='Colle'?'Khôlle':e.type==='SI'?'SI':e.type} ${e.type==='SI'?'':e.mat||''}`.trim(),loc=(String(e.label).match(/salle\s+(\S+)/i)||[])[1];
  L.push('BEGIN:VEVENT','UID:'+e.id+'@qgprepa','DTSTAMP:'+st,'SUMMARY:'+icsEsc(sum));
  if(e.h){const s=new Date(e.date+'T'+e.h),en=new Date(s.getTime()+(e.type==='SI'?110:e.type==='DS'?180:60)*6e4);L.push('DTSTART;TZID=Europe/Paris:'+icsT(s),'DTEND;TZID=Europe/Paris:'+icsT(en))}
  else{const s=new Date(e.date+'T12:00');L.push('DTSTART;VALUE=DATE:'+icsD(s),'DTEND;VALUE=DATE:'+icsD(addDays(1,s)))}
  if(e.label)L.push('DESCRIPTION:'+icsEsc(e.label));if(loc)L.push('LOCATION:'+icsEsc('Salle '+loc));
  if(e.type==='Colle'||e.type==='DS'||e.type==='Concours blanc')L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),'TRIGGER:'+(e.h?'-PT30M':'-PT6H'),'END:VALARM');
  L.push('END:VEVENT')}
 L.push('END:VCALENDAR');return L.join('\r\n')}

function parseED(txt){const out=[];let cur='';
 for(let line of String(txt).split(/\r?\n/)){line=line.trim().replace(/\b(lv|s|t|p)\s?\d\b/gi,' ');if(!line)continue;const m=SUBJ.find(([r])=>r.test(line));
  if(m){cur=S.set.subjects.find(s=>s.toLowerCase()===m[1].toLowerCase())||m[1];line=line.replace(/^\D*/,'')}
  else if(/moyenne|classe|rang|effectif|appr[ée]ciation|p[ée]riode|trimestre|semestre/i.test(line))continue;
  if(!cur)continue;line=line.replace(/\d{1,2}\/\d{1,2}\/\d{2,4}/g,' ').replace(/\d{1,2}[:h]\d{2}/g,' ');
  for(const g of line.matchAll(/(?<![\d.,\/])(\d{1,2}(?:[.,]\d{1,2})?)(?:\s*\/\s*(\d{1,3}(?:[.,]\d+)?))?(?:\s*\(\s*(\d+(?:[.,]\d+)?)\s*\))?(?![\d.,])/g)){
   const v=parseFloat(g[1].replace(',','.')),mx=g[2]?parseFloat(g[2].replace(',','.')):20,c=g[3]?parseFloat(g[3].replace(',','.')):1;
   if(mx>0&&v<=mx)out.push({mat:cur,v,max:mx,coef:c,on:true})}}
 return out}

  return`${ok?'':'<div class="row2" style="margin:0 0 12px"><button class="btn" data-act="perms">Activer notifications et barre des menus</button></div>'}

/* ---------- minuteur ---------- */
const P={run:false,phase:'work',end:0,left:S.set.work*60,mat:S.set.subjects[0]};
const fmt=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
function durRow(){const w=S.set.work,b=S.set.brk;return`<div class="dur"><span>Focus</span>${[25,45,60,90].map(m=>`<button data-act="p-dur" data-k="work" data-v="${m}" aria-pressed="${w===m}">${m}</button>`).join('')}<input class="p-custom" data-k="work" type="number" min="1" max="240" value="${w}" aria-label="Durée du focus en minutes">min
 <span style="margin-left:8px">Pause</span>${[5,10,15].map(m=>`<button data-act="p-dur" data-k="brk" data-v="${m}" aria-pressed="${b===m}">${m}</button>`).join('')}<input class="p-custom" data-k="brk" type="number" min="1" max="60" value="${b}" aria-label="Durée de la pause en minutes">min</div>`}
function setDur(k,v){v=Math.round(+v);if(!(v>=1))return;S.set[k]=Math.min(k==='work'?240:60,v);if(!P.run&&((k==='work')===(P.phase==='work')))P.left=S.set[k]*60;save()}
function zenHTML(){return`<button class="btn ghost zq" data-act="zen-off">Quitter · Échap</button><div class="ph">${P.phase==='work'?'Focus':'Pause'}</div>
 <select class="p-mat" aria-label="Matière">${subjOpts(P.mat)}</select><div class="tm-time">${fmt(P.left)}</div><div class="bar"><i class="tm-bar"></i></div>
 <div class="row2"><button class="btn ghost" data-act="p-add" data-v="-5">−5 min</button><button class="btn tm-go" data-act="p-go">${P.run?'Pause':'Démarrer'}</button><button class="btn ghost" data-act="p-add" data-v="5">+5 min</button></div>
 <div class="row2"><button class="btn ghost sm" data-act="p-reset">Reset</button><button class="btn ghost sm" data-act="p-skip">${P.phase==='work'?'Passer à la pause':'Reprendre le focus'}</button></div>${durRow()}`}
let zenOn=false;
function zen(on){zenOn=on;const z=$('#zen');z.classList.toggle('on',on);document.body.classList.toggle('zen',on);
 if(on){z.innerHTML=zenHTML();drawTimer();try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){}}
 else{z.innerHTML='';try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&zenOn)zen(false)});
document.addEventListener('keydown',e=>{if(!zenOn)return;if(e.key==='Escape')zen(false);if(e.key===' '&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();pGo()}});
function timerCard(){const w7=[...Array(7)].reduce((a,_,i)=>a+minsOn(dkey(addDays(-i))),0);return`<section class="timer ${P.phase}"><div class="th"><h3>${P.phase==='work'?'Focus':'Pause'}</h3><select class="p-mat" aria-label="Matière du focus">${subjOpts(P.mat)}</select></div>
 <div class="tm-time">${fmt(P.left)}</div><div class="bar"><i class="tm-bar"></i></div>
 <div class="row2"><button class="btn tm-go" data-act="p-go">${P.run?'Pause':'Démarrer'}</button><button class="btn ghost" data-act="p-reset">Reset</button><button class="btn ghost" data-act="p-skip">${P.phase==='work'?'Passer':'Reprendre'}</button><button class="btn ghost" data-act="zen">Plein écran</button></div>
 ${durRow()}
 <p class="small">${minsOn(dkey())} min aujourd’hui · ${Math.floor(w7/60)} h ${pad(w7%60)} sur 7 jours</p></section>`}
function drawTimer(){const tot=(P.phase==='work'?S.set.work:S.set.brk)*60;
 $$('.tm-time').forEach(e=>e.textContent=fmt(P.left));$$('.tm-bar').forEach(e=>e.style.width=Math.max(0,100-P.left/Math.max(tot,P.left)*100)+'%');$$('.tm-go').forEach(e=>e.textContent=P.run?'Pause':'Démarrer')}
function phase(p){P.phase=p;P.run=false;P.left=(p==='work'?S.set.work:S.set.brk)*60;render();trayLater()}
function tick(){if(!P.run)return;P.left=Math.max(0,Math.round((P.end-Date.now())/1000));
 if(P.left<=0){if(P.phase==='work'){const k=dkey();S.focus[k]=S.focus[k]||{};S.focus[k][P.mat]=(S.focus[k][P.mat]||0)+S.set.work;
   notify(`${S.set.work} min de ${P.mat} : bravo ! Pause de ${S.set.brk} min.`);P.phase='brk';P.left=S.set.brk*60;save()}
  else{notify('Fin de la pause, on y retourne.');phase('work')}P.run=false}
 drawTimer()}
function pGo(){if(P.run){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));P.run=false}else{P.end=Date.now()+P.left*1000;P.run=true;audio()}drawTimer();trayLater()}

/* ---------- rappels, son, toasts ---------- */
let AC=null;function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function beep(){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.75)}catch(e){}}
let tt=null,undo=null;
function toast(msg,u){const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${u?'<button data-act="undo">Annuler</button>':''}`;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),u?6000:4500)}
function notify(msg){toast(msg);beep();if(isApp&&perms.notifications==='granted')desk.notification.show({body:msg.slice(0,300)}).catch(()=>{})}
function checkRem(){if(!ready)return;const now=Date.now();let ch=false;
 for(const r of S.rem){if(r.off)continue;const t=new Date(r.at).getTime();if(isNaN(t)||t>now)continue;
  if(now-t<12*36e5)notify('Rappel : '+r.t);
  if(r.rep){const d=new Date(r.at),st=r.rep==='day'?1:7;while(d.getTime()<=now)d.setDate(d.getDate()+st);r.at=localISO(d)}else r.off=true;ch=true}
 if(ch)save()}

/* ---------- Mac : app, widget, barre des menus ---------- */
let desk=null,isApp=false,perms={},installState='unavailable';
const mode=()=>{try{return localStorage.getItem('qgprepa-mode')||'full'}catch(e){return'full'}};
const setMode=m=>{try{localStorage.setItem('qgprepa-mode',m);localStorage.setItem('qgprepa-place',m)}catch(e){}};
const OPT={full:{titleBarStyle:'hiddenInset',dragHeight:40},widget:{frame:false,alwaysOnTop:true,dragHeight:0}};
function icon(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 x.fillStyle='#151515';x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
 x.strokeStyle='#fff';x.lineWidth=16;x.beginPath();x.moveTo(84,132);x.lineCap='round';x.lineJoin='round';x.lineTo(118,166);x.lineTo(176,96);x.stroke();return c.toDataURL('image/png')}
function trayIcon(){const c=document.createElement('canvas');c.width=c.height=36;const x=c.getContext('2d');x.strokeStyle='#000';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';
 x.strokeRect(5,5,26,26);x.beginPath();x.moveTo(11,18);x.lineTo(16,23);x.lineTo(25,12);x.stroke();return c.toDataURL('image/png')}
let trT=null;const trayLater=()=>{if(!isApp)return;clearTimeout(trT);trT=setTimeout(tray,300)};
function tray(){if(!isApp)return;const n=todayTodos().length;desk.app.dock.setBadge(n?String(n):'').catch(()=>{});
 if(perms['menu-bar']!=='granted')return;const dl=daysLeft();
 const title=P.run?`${P.phase==='work'?'Focus':'Pause'} ${Math.ceil(P.left/60)} min`:(dl>0?`J-${dl}`:'Concours');
 desk.tray.set({icon:trayIcon(),title,toolTip:`${n} tâche${n>1?'s':''} pour aujourd’hui`,menu:[
  {label:P.run?'Mettre le focus en pause':`Lancer ${P.phase==='work'?'un focus de '+S.set.work:'la pause de '+S.set.brk} min (${P.mat})`,click:()=>{pGo()}},
  {label:`${n} tâche${n>1?'s':''} pour aujourd’hui`,enabled:false},
  ...todayTodos().slice(0,5).map(t=>({label:'○ '+t.t.slice(0,60),click:()=>{t.done=true;t.doneAt=dkey();save()}})),
  {type:'separator'},{label:'Ouvrir QG Prépa',click:()=>{desk.window.show().catch(()=>{})}},
  {label:mode()==='widget'?'Revenir au mode complet':'Passer en mode widget',click:()=>{desk.window.show().catch(()=>{});toggleWidget()}}]}).catch(()=>{})}
async function askPerms(){try{perms=await desk.permissions.request(['notifications','menu-bar'])}catch(e){toast('Impossible de demander les autorisations maintenant.')}
 if(perms.notifications==='denied'||perms['menu-bar']==='denied'){toast('Autorisation refusée : tu peux la changer dans Permissions.');desk.permissions.manage().catch(()=>{})}
 tray();render()}
async function toggleWidget(){if(!isApp)return;const go=mode()!=='widget';
 if(go){let p={};try{p=await desk.permissions.request(['overlay'])}catch(e){}
  if(p.overlay!=='granted'){toast('Le mode widget a besoin de l’autorisation « fenêtre flottante ».');return}}
 setMode(go?'widget':'full');try{await desk.window.setOptions(OPT[go?'widget':'full'])}catch(e){setMode('full');toast('Le mode widget n’a pas pu s’ouvrir.')}}
async function initDesk(){if(typeof claude==='undefined')return;try{desk=await claude.use('desktop')}catch(e){}
 if(desk&&desk.window){isApp=true;document.body.classList.add('app');desk.app.dock.setIcon(icon()).catch(()=>{});
  let m=mode();if(m==='widget')document.body.classList.add('widget');
  try{const r=await desk.window.setOptions(OPT[m]);if(r&&r.reloading)return}
  catch(e){if(m==='widget'){setMode('full');document.body.classList.remove('widget');m='full';desk.window.setOptions(OPT.full).catch(()=>{})}}
  let pl=null;try{pl=localStorage.getItem('qgprepa-place');localStorage.removeItem('qgprepa-place')}catch(e){}
  if(m==='widget'){desk.window.setVisibleOnAllWorkspaces(true).catch(()=>{});if(pl)desk.window.place({anchor:'top_right',margin:18,width:340,height:540}).catch(()=>{})}
  else if(pl)desk.window.place({anchor:'center',width:1120,height:780}).catch(()=>{});
  try{perms=await desk.permissions.state()}catch(e){perms={}}
  render();tray();setInterval(tray,20000)}
 else{try{installState=await desk.install.state()}catch(e){installState='unavailable'}if(route()==='reglages')render()}}

/* ---------- actions ---------- */
const find=(k,id)=>S[k].find(x=>x.id===id);
function del(k,id){const i=S[k].findIndex(x=>x.id===id);if(i<0)return;undo={k,i,it:S[k].splice(i,1)[0]};save();toast('Supprimé.',true)}
const A={
 'todo-toggle':id=>{const t=find('todos',id);if(!t)return;t.done=!t.done;t.doneAt=t.done?dkey():null;save()},
 'todo-del':id=>del('todos',id),
 'todo-edit':(id,el)=>{const t=find('todos',id);if(!t||el.querySelector('input'))return;const i=document.createElement('input');i.value=t.t;i.setAttribute('aria-label','Modifier la tâche');el.replaceChildren(i);i.focus();
  let done=false;const fin=ok=>{if(done)return;done=true;const v=i.value.trim();if(ok&&v&&v!==t.t){t.t=v;save()}else render()};
  i.addEventListener('keydown',e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)});i.addEventListener('blur',()=>fin(true))},
 'tf':(id,b)=>{tf=b.dataset.v;render()},
 'goal-del':id=>del('goals',id),
 'step':(id,b)=>{const g=find('goals',id),s=g&&g.steps[+b.dataset.i];if(s){s.d=b.checked;save()}},
 'step-del':(id,b)=>{const g=find('goals',id);if(g){g.steps.splice(+b.dataset.i,1);save()}},
 'rem-del':id=>del('rem',id),'rem-clear':()=>{S.rem=S.rem.filter(r=>!r.off);save()},
 'week-del':id=>del('week',id),'grade-del':id=>del('grades',id),
 'pf':(id,b)=>{pf=b.dataset.v;render()},
 'ev-del':id=>del('events',id),
 'ev-edit':id=>{editEv=id;render();setTimeout(()=>$('.evedit input')?.focus(),0)},'ev-cancel':()=>{editEv=null;render()},
 'ics':()=>{const k=dkey(),f=e=>pf==='all'||(pf==='DS'?(e.type==='DS'||e.type==='Concours blanc'):e.type===pf);const L=S.events.filter(e=>e.date>=k&&f(e));download('prepa-planning.ics',buildICS(L),'text/calendar');toast(L.length+' événements exportés : ouvre le fichier pour les ajouter à Calendrier.')},
 'rem-todos':()=>toReminders(S.todos.filter(t=>!t.done).map(t=>({t:(t.mat?t.mat+' · ':'')+t.t,at:(t.due||dkey())+' 08:00'}))),

 'err-ok':id=>{const e=find('errs',id);if(!e)return;e.lvl=(e.lvl||0)+1;if(e.lvl>=REV.length){e.ok=true;toast('Erreur maîtrisée.')}else e.next=dkey(addDays(REV[e.lvl]));save()},

};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.classList.contains('evedit')){const ev=find('events',f.dataset.id),d=new FormData(f);if(ev){Object.assign(ev,{date:d.get('date'),h:d.get('h')||'',type:d.get('type'),mat:d.get('mat'),label:d.get('label').trim(),plan:false})}editEv=null;save();toast('Planning modifié.');return}
